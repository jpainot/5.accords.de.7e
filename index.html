<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accords de septième — 5 types</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172238;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:700px;margin:auto}h1{font-size:clamp(1.5rem,4vw,2rem);margin:0 0 6px}.sub{color:#596579;margin:0 0 25px}.card{background:white;border:1px solid #e0e5ed;border-radius:20px;padding:28px 20px;text-align:center}.tag{color:#637084;font-size:.9rem}.chord{font-size:clamp(4rem,14vw,7rem);font-weight:750;letter-spacing:-.04em;min-height:160px;display:flex;align-items:center;justify-content:center}.progress{height:7px;background:#e8edf3;border-radius:8px;overflow:hidden;margin:16px 0}.bar{height:100%;background:#365fc9;width:100%;transition:width .1s linear}.meta{display:flex;justify-content:space-between;gap:12px;color:#536075;font-size:.92rem}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}button,select{border:1px solid #bfc8d8;border-radius:10px;padding:12px 16px;font:inherit;background:white;color:#172238;min-height:46px}button{cursor:pointer}button.primary{background:#315dc5;color:white;border-color:#315dc5}button:disabled{opacity:.45;cursor:not-allowed}label{display:flex;align-items:center;gap:8px;margin-left:auto}.note{color:#677286;font-size:.9rem;line-height:1.5}@media(max-width:440px){label{margin-left:0;width:100%}select{flex:1}}
</style>
</head>
<body><main class="wrap"><h1>Cinq accords de septième</h1><p class="sub">5 types · 60 accords · entraînement au piano</p><section class="card"><div class="tag">Trouvez et jouez cet accord</div><div class="chord" id="chord" aria-live="polite">Prêt ?</div><div class="progress"><div class="bar" id="bar"></div></div><div class="meta"><span id="counter">0 / 60</span><span id="time">0,0 s</span></div></section><div class="controls"><button class="primary" id="start">Démarrer</button><button id="pause" disabled>Pause</button><button id="reset">Recommencer</button><label for="speed">Durée par accord <select id="speed"><option value="2">2 s</option><option value="3">3 s</option><option value="4">4 s</option><option value="5">5 s</option><option value="6" selected>6 s</option><option value="8">8 s</option><option value="10">10 s</option><option value="15">15 s</option></select></label></div><p class="note">Les accords sont mélangés sans répétition jusqu'à la fin des 60 cartes. Les symboles affichés sont uniquement : Maj7, min7, 7, °7 et ø7.</p></main>
<script>
(()=>{'use strict';const roots=['Do','Do♯','Ré','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];const suffixes=['Maj7','min7','7','°7','ø7'];const cards=roots.flatMap(root=>suffixes.map(suffix=>root+suffix));const $=id=>document.getElementById(id);let deck=[],position=0,running=false,remaining=6000,last=0,raf=null;const duration=()=>Number($('speed').value)*1000;function shuffle(){deck=[...cards];for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function render(){const d=duration();$('bar').style.width=(100*Math.min(d,Math.max(0,d-remaining))/d)+'%';$('time').textContent=(Math.min(d,Math.max(0,d-remaining))/1000).toFixed(1).replace('.',',')+' s';$('counter').textContent=position+' / '+deck.length;$('start').disabled=running;$('pause').disabled=!running;$('pause').textContent='Pause'}function next(){if(position>=deck.length){stop();$('chord').textContent='Terminé !';return} $('chord').textContent=deck[position++];remaining=duration();render()}function tick(now){if(!running)return;remaining-=now-last;last=now;if(remaining<=0){next();if(!running)return}render();raf=requestAnimationFrame(tick)}function stop(){running=false;if(raf!==null)cancelAnimationFrame(raf);raf=null;render()}function start(){if(running)return;if(!deck.length||position>=deck.length){shuffle();position=0;next()}running=true;last=performance.now();render();raf=requestAnimationFrame(tick)}$('start').addEventListener('click',start);$('pause').addEventListener('click',stop);$('reset').addEventListener('click',()=>{stop();shuffle();position=0;remaining=duration();$('chord').textContent='Prêt ?';render()});$('speed').addEventListener('change',()=>{remaining=duration();last=performance.now();render()});shuffle();render();})();
</script></body></html>
